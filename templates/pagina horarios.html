<!DOCTYPE html>
<html> 
<head> 
    <meta charset="utf-8"/>
    <title>HODEFES ඞ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="{{url_for('static',filename='css/pagina horarios.css')}}"/>
</head>

<body id="body">
     <header>
            <a class="enlace" href="http://127.0.0.1:5000/pagina_horarios/"> HODEFES</a>
        </header>
        <nav>
            <form> 
                <i class="fa-solid fa-filter"></i> 
                <input type="text"/>
                <i class="fa-solid fa-magnifying-glass"></i>
            </form>
        </nav>
    <div id="container">
        <!--cuadros de informacion de los docentes -->
        <section id="contenido">
            <div class="horarios">
                {% for profesor in datos %}
                    <article class="article"> 
                        <h1 id="nombre_profesor"> {{profesor.nombre}} </h1>
                        <h3> Lugares donde se puede encontrar:</h3>
                        <p> {{profesor.lugar}} </p>
                        <h3>  Horarios  </h3>
                            <ul>
                                <li> {{profesor.horario}} </li>
                            </ul>
                        <a href={{profesor.pdf}} >PDF</a> 

                        <button onclick="abrirmodal()"> Sistema de consulta</button>  
                        <!-- cuadro del sistema de consultas -->
                        <div class ="modal_fondo" id="modal">
                            <div class="modal">
                                <h2>Ha entrado al sistema de consultas, ¿Que quiere hacer? {{profesor.nombre}}</h2>
                                <!-- enviar consulta presencial -->
                                <form action="/enviar_ticket/{{usuario}}/{{profesor.nombre}}" method="POST">
                                    <button type="submit" name="ticket presencial">
                                        Consulta Presencial
                                    </button>
                                </form>
                                <!-- enviar Duda -->
                                <button onclick="texto_click()" class="texto_click"> 
                                    Escribir Duda 
                                </button>
                                    <div class="contenido_duda" id="contenido_duda">
                                        <form action="/enviar_ticket/{{usuario}}/{{profesor.nombre}}" method="POST">
                                            <input type="text" placeholder="Escriba aqui su duda" name="ticket duda">
                                            <input type="submit">
                                        </form>
                                    </div>

                                <!-- mostrar tickets enviados y respondidos-->
                                <h2> Tickets enviados </h2>
                                    <h4> Pendientes: </h4>
                                    <!-- para despues-->
                                    <h4> Respondidos: </h4>
                                    <!-- para despues-->
                                <!-- cerrar sistema de consultas -->
                                <button onclick="cerrarmodal()">
                                    cerrar
                                </button>
                            </div>
                        </div>
                    </article>
                {% endfor %}

            
        <script>
            function abrirmodal(){
                document.getElementById("modal").style.display = "block";

            }
            function cerrarmodal(){
                document.getElementById("modal").style.display = "none";
                

            }
            function texto_click(){        
                let contenido = document.getElementById("contenido_duda");

                if(contenido.style.display == "block"){
                    contenido.style.display = "none";
                }
                else{
                    contenido.style.display = "block";
                }
            }
        </script>
        </section>
    </div>
</body>
</html>
